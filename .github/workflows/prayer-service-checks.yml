name: Prayer service checks
on:
  push:
    branches: [codex/audit-and-rebuild, main]
    paths: ['backend/**', '.github/workflows/prayer-service-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Use preinstalled Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --prefix backend/functions
      - run: npm run build --prefix backend/functions
      - run: node backend/tests/run-emulators.mjs http
      - name: Check advisory package reachability in compiled API and cleanup
        run: node backend/tests/run-emulators.mjs guarded
